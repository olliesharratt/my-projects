name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test rate-limiter/tests/RateLimiting.Tests -c Release
      - run: dotnet test chat-server/tests/ChatServer.Tests -c Release
      - run: dotnet test raft-lite/tests/RaftLite.Tests -c Release
