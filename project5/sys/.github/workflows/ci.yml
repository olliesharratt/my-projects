name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  c-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C mini-shell test
      - run: make -C thread-pool test
      - run: make -C thread-pool tsan
  http-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test http-server/tests/TinyHttp.Tests -c Release
