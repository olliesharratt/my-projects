name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test kv-store/tests/KvStore.Tests -c Release
      - run: dotnet test search-engine/tests/SearchEngine.Tests -c Release
